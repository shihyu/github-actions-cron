name: Fetch Binance Prices (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run crawler
        run: uv run python src/crawler.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Switch to main branch and update to avoid conflicts
          git fetch origin main
          git checkout main
          git pull origin main
          
          git add data/*.json
          git commit -m "data: update price data (manual) [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Display results
        run: |
          echo "=== 最新價格資料 ==="
          cat data/*.json | tail -20
